<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSO Callback - StaffBridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      background: rgba(255, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Completing SSO Login...</h1>
    <p id="status">Processing authentication...</p>
    <div id="error" class="error" style="display: none;"></div>
  </div>

  <script>
    (async function() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      
      try {
        // Get code and state from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');

        // Check for OAuth errors
        if (error) {
          throw new Error(errorDescription || error);
        }

        if (!code || !state) {
          throw new Error('Missing authorization code or state parameter');
        }

        statusEl.textContent = 'Verifying authentication...';

        // Detect if this is a mobile browser (expo-web-browser)
        const userAgent = navigator.userAgent || '';
        const isMobile = /Mobile|Android|iPhone|iPad/i.test(userAgent);
        const isExpoBrowser = /okhttp/i.test(userAgent) || window.location.href.includes('expo');
        
        console.log('User Agent:', userAgent);
        console.log('Is Mobile:', isMobile);
        console.log('Is Expo Browser:', isExpoBrowser);
        console.log('Code:', code ? 'Present' : 'Missing');
        console.log('State:', state ? 'Present' : 'Missing');

        // Get backend API URL from environment or use default
        const backendUrl = window.ENV?.BACKEND_URL || 'https://backend-y16q.onrender.com';
        
        // Call backend mobile callback endpoint
        statusEl.textContent = 'Completing login...';
        
        const response = await fetch(`${backendUrl}/api/sso/mobile-callback`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ code, state })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Failed to complete SSO login');
        }

        const { token, platform } = data;

        if (!token) {
          throw new Error('No token received from backend');
        }

        console.log('Token received:', token ? 'Present' : 'Missing');
        console.log('Platform:', platform);

        // Redirect to mobile app
        statusEl.textContent = 'Redirecting to mobile app...';
        
        const mobileUrl = `staffbridge://sso-callback?token=${encodeURIComponent(token)}`;
        console.log('Redirecting to:', mobileUrl);
        
        // Try to redirect to mobile app
        window.location.href = mobileUrl;
        
        // Fallback: if app doesn't open within 2 seconds, show error
        setTimeout(() => {
          errorEl.style.display = 'block';
          errorEl.innerHTML = `
            <h3>Unable to open mobile app</h3>
            <p>Please ensure the StaffBridge mobile app is installed and try again.</p>
            <p>If the app is installed, you may need to manually open it.</p>
          `;
          statusEl.textContent = 'Redirect failed';
        }, 2000);

      } catch (error) {
        console.error('SSO Callback Error:', error);
        errorEl.style.display = 'block';
        errorEl.textContent = `Error: ${error.message}`;
        statusEl.textContent = 'Authentication failed';
        
        // Try to redirect to login page with error after 3 seconds
        setTimeout(() => {
          window.location.href = '/login?error=' + encodeURIComponent(error.message);
        }, 3000);
      }
    })();
  </script>
</body>
</html>
